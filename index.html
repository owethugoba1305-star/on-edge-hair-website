<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>On Edge Hair, Barber & Beauty</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(13, 13, 13, 0.96);
      border-bottom: 1px solid #292929;
      padding: 18px 6%;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo span {
      color: #d4af37;
    }

    nav {
      display: flex;
      gap: 22px;
    }

    nav a {
      font-size: 14px;
      color: #ddd;
    }

    nav a:hover {
      color: #d4af37;
    }

    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 6%;
      background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.88)),
        radial-gradient(circle at center, #292929, #080808 70%);
    }

    .hero-content {
      max-width: 850px;
    }

    .tag {
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 82px);
      line-height: 1;
      margin-bottom: 22px;
      letter-spacing: -2px;
    }

    .hero p {
      color: #ccc;
      max-width: 650px;
      margin: 0 auto 32px;
      font-size: 17px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 4px;
      font-weight: bold;
      transition: .2s;
    }

    .btn-gold {
      background: #d4af37;
      color: #111;
    }

    .btn-dark {
      border: 1px solid #777;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    section {
      padding: 80px 6%;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title .small {
      color: #d4af37;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: bold;
    }

    .section-title h2 {
      font-size: 38px;
      margin-top: 8px;
    }

    .section-title p {
      color: #aaa;
      max-width: 600px;
      margin: 12px auto 0;
    }

    .services {
      background: #121212;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service-card {
      background: #1b1b1b;
      padding: 35px 25px;
      border: 1px solid #292929;
      border-radius: 8px;
